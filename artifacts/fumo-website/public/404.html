<!doctype html>

      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { width: min(100%, 38rem); padding: clamp(1.5rem, 5vw, 3rem); border: 1px solid #dce3ef; border-radius: 1rem; background: white; box-shadow: 0 1rem 3rem #18243a12; }

      a:focus-visible { outline: 3px solid #e8b44b; outline-offset: 3px; }

  <body>
